# People to monitor. For each person, the script searches YouTube for long-form
# videos matching the query. Claude reviews the candidates and accepts only
# original talks/interviews (not reactions, summaries, or other derivative content).
#
# Tips for search_query:
#   - Use the person's full name as the query — no genre keywords or quotes needed
#   - The "This week" filter + heuristic blacklist + Claude classification handle noise
#   - For bilingual subjects, add a second entry with their native name
thought_leaders:
  # OpenAI
  - name: "Sam Altman"          # CEO, OpenAI
    search_query: 'Sam Altman'
  - name: "Greg Brockman"       # Co-founder, OpenAI
    search_query: 'Greg Brockman'
  # Anthropic
  - name: "Dario Amodei"        # CEO, Anthropic
    search_query: 'Dario Amodei'
  - name: "Amanda Askell"       # Character lead, Anthropic
    search_query: 'Amanda Askell'
  # Google DeepMind
  - name: "Demis Hassabis"      # CEO, Google DeepMind
    search_query: 'Demis Hassabis'
  - name: "Jeff Dean"           # Chief Scientist, Google
    search_query: 'Jeff Dean'
  # Meta AI
  - name: "Yann LeCun"          # Chief AI Scientist, Meta
    search_query: 'Yann LeCun'
  # Researchers / academics
  - name: "Geoffrey Hinton"     # Godfather of deep learning, Turing Award
    search_query: 'Geoffrey Hinton'
  - name: "Yoshua Bengio"       # Deep learning pioneer, Turing Award
    search_query: 'Yoshua Bengio'
  - name: "Fei-Fei Li"          # Stanford HAI co-director, ImageNet creator
    search_query: 'Fei-Fei Li'
  - name: "Andrej Karpathy"     # Ex-Tesla AI / OpenAI, educator
    search_query: 'Andrej Karpathy'
  - name: "Andrew Ng"           # DeepLearning.AI founder, Stanford professor
    search_query: 'Andrew Ng'
  # Other labs / founders
  - name: "Ilya Sutskever"      # Co-founder, Safe Superintelligence Inc.
    search_query: 'Ilya Sutskever'
  - name: "Aidan Gomez"         # CEO, Cohere
    search_query: 'Aidan Gomez'
  # Industry
  - name: "Jensen Huang"        # CEO, NVIDIA
    search_query: 'Jensen Huang'
  - name: "Satya Nadella"       # CEO, Microsoft
    search_query: 'Satya Nadella'
  - name: "Peter Steinberger"   # Creator of OpenClaw
    search_query: 'Peter Steinberger'

# Org-based searches. Useful for catching talks from people you don't know yet
# — engineers, researchers, and founders from specific AI labs who aren't on the
# person watchlist.
#
# org: the organization this search targets. Claude only accepts a candidate if
# the speaker is confirmed to be from this specific org (not any AI org — just
# this one). This prevents a "Meta AI Talks" search from accepting an OpenAI
# researcher who happens to appear in the results.
orgs:
  enabled: true
  searches:
    - name: "Anthropic Talks"
      search_query: 'anthropic researcher talk podcast'
      org: "Anthropic"
      min_duration_minutes: 20
    - name: "OpenAI Talks"
      search_query: 'openai researcher talk podcast'
      org: "OpenAI"
      min_duration_minutes: 20
    - name: "Google DeepMind Talks"
      search_query: 'deepmind researcher talk podcast'
      org: "Google DeepMind"
      min_duration_minutes: 20
    - name: "Meta AI Talks"
      search_query: 'meta AI researcher talk podcast'
      org: "Meta AI"
      min_duration_minutes: 20

# Channel watchlist. Monitors specific high-signal channels for any AI talk or interview.
# Uses YouTube API (channel_id required) when YOUTUBE_API_KEY is set; falls back to yt-dlp (url).
# Claude classifies channel entries broadly: is this a genuine AI talk/interview?
channels:
  enabled: true
  list:
    - name: "Lex Fridman"
      channel_id: "UCSHZKyawb77ixDdsGog4iWA"
      url: "https://www.youtube.com/@lexfridman"
    - name: "Dwarkesh Patel"
      channel_id: "UCDWkfXRiKRgXkB3bJyGWjZg"
      url: "https://www.youtube.com/@DwarkeshPatel"
    - name: "Machine Learning Street Talk"
      channel_id: "UCMLtBahI5DMrt0NPvDSoIRQ"
      url: "https://www.youtube.com/@MachineLearningStreetTalk"
    - name: "Y Combinator"
      channel_id: "UCcefcZRL2oaA_uBNeo5UOWg"
      url: "https://www.youtube.com/@ycombinator"
    - name: "Zhang Xiaojun Podcast"
      channel_id: "UC3Sv1JuKpbOx3csUO8FAo5g"
      url: "https://www.youtube.com/@xiaojunpodcast"

# Minimum video length in minutes. Videos shorter than this are skipped before
# any API classification call. Raises this to cut more noise.
min_duration_minutes: 20

# Rolling search window: every run searches this many days back from now.
# Override per-run with --lookback-days N (e.g. to backfill after a long gap).
lookback_days: 5

# Backend selection:
#   - search:
#       auto        -> YouTube API when YOUTUBE_API_KEY exists, else yt-dlp
#       youtube_api -> force official API search
#       yt_dlp      -> force yt-dlp search even if YOUTUBE_API_KEY exists
#   - metadata:
#       auto        -> YouTube API when YOUTUBE_API_KEY exists, else yt-dlp
#       youtube_api -> force videos.list metadata enrichment
#       yt_dlp      -> force per-video yt-dlp enrichment
# Useful hybrid mode:
#   backends:
#     search: yt_dlp
#     metadata: youtube_api
backends:
  search: yt_dlp
  metadata: auto

# yt-dlp options. These apply whenever either backend resolves to yt_dlp.
# yt-dlp has known limitations: date filtering is approximate, and per-video
# metadata fetches frequently hit YouTube bot-checks unless cookies are provided.
# Prefer YouTube API metadata when a key is available.
ytdlp_search:
  use_this_week_filter: true
  cookies_from_browser: ""  # chrome, firefox, or safari — leave blank to disable

# Notification delivery after --commit / --commit-file.
# backend:
#   - "native"    → direct built-in delivery (currently Telegram only)
#   - "openclaw"  → hand off delivery to `openclaw message send`
#   - "none"      → disable notifications
notifications:
  backend: "openclaw"
  language: "zh"   # "original" or "zh" — controls titles used in chat notifications
  include_excerpt: true  # include a short one-line description excerpt in chat notifications
  native:
    channel: "telegram"
    target: ""            # Telegram chat id / channel id for built-in Telegram delivery
  openclaw:
    binary: "openclaw"
    channel: "feishu"   # "telegram" or "feishu"
    target: "feishu:group:oc_fd1396229af9bb9627e53262c5ed1532"            # e.g. "123456789", "@channelname", "feishu:group:oc_xxx", "feishu:dm:ou_xxx"
    account: ""           # optional OpenClaw account id
